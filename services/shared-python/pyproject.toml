[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "commerce-ai-common"
version = "0.1.0"
description = "Shared settings for Commerce AI FastAPI services"
requires-python = ">=3.11"
dependencies = ["pydantic-settings>=2.6,<3"]

[tool.setuptools.packages.find]
where = ["."]
