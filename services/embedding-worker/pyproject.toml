[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "commerce-ai-embedding-worker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "commerce-ai-common",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.uv.sources]
commerce-ai-common = { path = "../shared-python", editable = true }
