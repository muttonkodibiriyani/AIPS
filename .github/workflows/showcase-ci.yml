name: Showcase CI

on:
  push:
    branches: [main, master]
    paths:
      - "apps/showcase/**"
      - "package.json"
      - ".npmrc"
      - "pnpm-workspace.yaml"
      - "packages/**"
      - "scripts/**"
      - ".github/workflows/showcase-ci.yml"
  pull_request:
    paths:
      - "apps/showcase/**"
      - "package.json"
      - ".npmrc"
      - "pnpm-workspace.yaml"
      - "packages/**"
      - "scripts/**"

jobs:
  build-showcase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate package.json manifests (strict JSON)
        run: node scripts/validate-package-json.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps (npm workspaces — same as Vercel)
        run: npm install

      - name: Test showcase
        run: npm run test -w @commerce-ai/showcase

      - name: Build showcase
        run: npm run build -w @commerce-ai/showcase
